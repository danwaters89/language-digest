name: Daily digest

on:
  schedule:
    # 10:00 UTC = 5-6 am America/New_York (the learner's timezone), i.e. before the
    # morning. Adjust the hour if the learner's timezone changes (cron is always UTC).
    - cron: "0 16 * * *"
  workflow_dispatch:
  # Code changes deploy too; generation is skipped for push events.
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: daily-digest
  cancel-in-progress: false

jobs:
  generate-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # A non-zero exit fails the job here, before anything is committed or deployed.
      - name: Generate digest
        if: github.event_name != 'push'
        run: npm run generate
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}

      - name: Commit new digest
        if: github.event_name != 'push'
        run: |
          git add web/public/digests/
          if git diff --cached --quiet; then
            echo "No digest changes to commit."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Add digest $(TZ=America/New_York date +%F)"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Build web
        run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: generate-and-build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
